name: Bug report
description: Report reproducible incorrect behavior in SentinelAI
title: "bug: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve SentinelAI. Do not include API keys, real credentials, private prompts, or sensitive datasets.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Provide a small synthetic example or exact commands that reproduce the issue.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SentinelAI version
      placeholder: v0.1.0
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: 3.13.x
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux
        - macOS
        - Windows
        - Container
        - Other
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: Logs are welcome after removing sensitive values.
