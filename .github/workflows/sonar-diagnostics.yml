name: Sonar diagnostics

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Query public SonarCloud vulnerability findings
        shell: python
        run: |
          import json
          import urllib.parse
          import urllib.request

          query = urllib.parse.urlencode(
              {
                  "componentKeys": "mkarson1997_karzoun-sentinel-ai",
                  "resolved": "false",
                  "types": "VULNERABILITY",
                  "ps": "100",
              }
          )
          url = "https://sonarcloud.io/api/issues/search?" + query
          with urllib.request.urlopen(url, timeout=20) as response:
              payload = json.load(response)

          issues = payload.get("issues", [])
          print(f"open vulnerabilities: {len(issues)}")
          for issue in issues:
              print(
                  json.dumps(
                      {
                          "rule": issue.get("rule"),
                          "severity": issue.get("severity"),
                          "component": issue.get("component"),
                          "line": issue.get("line"),
                          "message": issue.get("message"),
                      },
                      ensure_ascii=False,
                  )
              )
