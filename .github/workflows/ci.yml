name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned uv wheel
        run: |
          python -m pip install --only-binary=:all: uv==0.10.0
      - name: Sync locked verification dependencies
        run: uv sync --locked --extra dev --no-install-project --no-build
      - name: Ruff
        run: uv run --locked --no-sync --no-build ruff check .
      - name: Mypy
        run: uv run --locked --no-sync --no-build mypy src
      - name: Tests
        run: uv run --locked --no-sync --no-build pytest

  ci-gate:
    name: CI Gate
    if: ${{ always() }}
    needs: verify
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confirm successful verification matrix
        if: ${{ needs.verify.result == 'success' }}
        run: echo "Verification matrix passed."

      - name: Fail when verification did not succeed
        if: ${{ needs.verify.result != 'success' }}
        run: exit 1
