name: Generate uv lock

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  lock:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned uv wheel
        run: python -m pip install --only-binary=:all: uv==0.10.0
      - name: Generate lockfile
        run: uv lock
      - name: Commit lockfile if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          if git diff --cached --quiet; then
            echo "uv.lock is already current"
          else
            git commit -m "chore: lock Python dependencies"
            git push
          fi
